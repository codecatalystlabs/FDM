<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#00316b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CatalystFDM</title>
    <script>
      // Apply the saved appearance before first paint so dark mode never flashes white.
      try {
        var p = JSON.parse(localStorage.getItem("catalystfdm.prefs") || "{}").appearance || "auto";
        if (p === "dark" || (p === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
