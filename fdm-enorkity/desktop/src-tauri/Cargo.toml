[package]
name = "fdm_enorkity_desktop"
version = "0.1.0"
description = "FDM-Enorkity desktop shell"
authors = ["FDM-Enorkity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=1.5.6", features = [] }

[dependencies]
tauri = { version = "=1.8.3", features = ["shell-open", "shell-sidecar", "process-command-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Lower peak memory usage for Windows release builds.
codegen-units = 1
lto = false
debug = 0
incremental = false
